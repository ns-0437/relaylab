<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">RelayLab — Make the handoff. Keep the proof.</title><desc id="desc">Worker A transfers a verified Git checkpoint to worker B across a durable ownership boundary.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#152b36"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#85b8c5" stroke-opacity=".07"/></pattern></defs>
<rect width="1280" height="400" rx="24" fill="url(#bg)"/><rect width="1280" height="400" rx="24" fill="url(#grid)"/>
<rect x="54" y="48" width="220" height="28" rx="14" fill="#1f3e43"/><text x="70" y="67" fill="#7ee3c8" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">RECOVERABLE EXECUTION</text>
<text x="52" y="160" fill="#f0f5f7" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">RelayLab</text>
<text x="56" y="211" fill="#c0d4df" font-family="Arial,sans-serif" font-size="25">Make the handoff. Keep the proof.</text>
<text x="56" y="254" fill="#829aa9" font-family="Arial,sans-serif" font-size="16">Fenced ownership · Durable events · Verified Git state</text>
<path d="M762 139H941V238H1070" fill="none" stroke="#6ee7c0" stroke-width="3" stroke-dasharray="7 8"/>
<rect x="700" y="100" width="140" height="80" rx="14" fill="#193644" stroke="#4b7585"/><text x="722" y="133" fill="#ecf5f7" font-family="Arial,sans-serif" font-size="20">Worker A</text><text x="722" y="159" fill="#90b9c6" font-family="monospace" font-size="13">epoch n</text>
<circle cx="941" cy="187" r="24" fill="#f4c46b"/><path d="m931 187 7 7 13-15" fill="none" stroke="#152b36" stroke-width="3"/>
<rect x="1000" y="207" width="200" height="80" rx="14" fill="#193d3c" stroke="#6ee7c0"/><text x="1023" y="241" fill="#ecf5f7" font-family="Arial,sans-serif" font-size="20">Worker B</text><text x="1023" y="267" fill="#8ed9c6" font-family="monospace" font-size="13">epoch n + 1</text>
<text x="752" y="328" fill="#9bb5c1" font-family="monospace" font-size="14">same commit / same tree / new owner</text>
<path d="M56 300H610" stroke="#36515e"/><text x="56" y="340" fill="#d0dfe6" font-family="monospace" font-size="13">TypeScript   Effect   MySQL   NATS   Docker   Kubernetes</text>
</svg>
