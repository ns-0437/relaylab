# Phase 1.2.1 patch, Part D: local-development-only Prometheus config.
# No credentials, no remote_write, no external notification integrations.
# Storage/retention limits are set on the Prometheus container's own
# command-line flags in infra/compose.yaml (--storage.tsdb.retention.time),
# not here.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The publisher/consumer run as HOST processes in this project (not
  # containerized -- see CLAUDE.md), so Prometheus (which DOES run in a
  # container here) must cross the container->host boundary to reach
  # them. `host.docker.internal` is Docker Desktop's documented mechanism
  # for this on Windows/Mac (added as an `extra_hosts` entry in
  # compose.yaml for Linux-host portability too -- see that file).
  - job_name: relaylab-publisher
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          role: publisher
  - job_name: relaylab-consumer
    static_configs:
      - targets: ["host.docker.internal:9465"]
        labels:
          role: consumer
